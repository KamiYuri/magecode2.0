# docker-compose.judge0.yml
# Judge0 CE v1.13.1 — Separate from MageCode due to privileged: true
#
# Usage:
#   docker compose -f docker-compose.judge0.yml up -d
#
# Prerequisites:
#   - Host must support cgroup v1
#   - Network 'magecode-judge0-link' created by main compose

services:
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: magecode-judge0-server
    volumes:
      - ./deploy/docker/judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    networks:
      - judge0-internal
      - judge0-link
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "100m"

  judge0-worker:
    image: judge0/judge0:1.13.1
    container_name: magecode-judge0-worker
    command: ["./scripts/workers"]
    volumes:
      - ./deploy/docker/judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    networks:
      - judge0-internal
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "100m"

  judge0-db:
    image: postgres:16-alpine
    container_name: magecode-judge0-db
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: ${JUDGE0_DB_USER:-judge0}
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD}
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data
    networks:
      - judge0-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  judge0-redis:
    image: redis:7-alpine
    container_name: magecode-judge0-redis
    command:
      - "bash"
      - "-c"
      - 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD}
    volumes:
      - judge0-redis-data:/data
    networks:
      - judge0-internal
    restart: always

networks:
  judge0-internal:
    name: magecode-judge0-internal
  judge0-link:
    name: magecode-judge0-link
    external: true

volumes:
  judge0-postgres-data:
    name: magecode-judge0-postgres-data
  judge0-redis-data:
    name: magecode-judge0-redis-data
