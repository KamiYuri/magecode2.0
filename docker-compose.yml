# docker-compose.yml
# MageCode 2.0 — 19 containers, 5 networks, 8 volumes
#
# Usage:
#   docker compose up -d                          # Dev: infrastructure only
#   docker compose --profile app up -d            # Deploy: + app services
#   docker compose --profile analysis up -d       # + analysis workers
#   docker compose --profile observability up -d  # + Prometheus/Grafana
#   docker compose --profile full up -d           # Everything

x-loki-logging: &loki-logging
  driver: loki
  options:
    loki-url: "http://localhost:3100/loki/api/v1/push"
    loki-batch-size: "400"
    loki-retries: "3"
    loki-max-backoff: "5s"
    labels: "service"

x-common-env: &common-env
  TZ: Asia/Ho_Chi_Minh

services:
  # ══════════════ APPLICATION (7) ══════════════

  api:
    profiles: ["app", "full"]
    build:
      context: ./services/api
      dockerfile: Dockerfile
      # Without this the build stops at the Dockerfile's last stage, which is
      # the test image and carries no application code.
      target: api
    container_name: magecode-api
    labels:
      - service=api
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=3"
      - "traefik.http.services.api.loadbalancer.server.port=9000"
    environment:
      <<: *common-env
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: pgbouncer
      DB_PORT: ${PGBOUNCER_PORT}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_DEFAULT_VHOST}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      REVERB_APP_ID: ${REVERB_APP_ID:-magecode}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      SANCTUM_STATEFUL_DOMAINS: ${APP_DOMAIN:-localhost}
    networks:
      - frontend
      - backend
    depends_on:
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      <<: *loki-logging

  web:
    profiles: ["app", "full"]
    build:
      context: ./services/web
      dockerfile: Dockerfile
    container_name: magecode-web
    labels:
      - service=web
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.services.web.loadbalancer.server.port=80"
    networks:
      - frontend
    restart: unless-stopped

  reverb:
    profiles: ["app", "full"]
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: reverb
    container_name: magecode-reverb
    labels:
      - service=reverb
      - "traefik.enable=true"
      - "traefik.http.routers.reverb.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.reverb.entrypoints=web"
      - "traefik.http.routers.reverb.priority=3"
      - "traefik.http.services.reverb.loadbalancer.server.port=8080"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      <<: *common-env
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: pgbouncer
      DB_PORT: ${PGBOUNCER_PORT}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REVERB_APP_ID: ${REVERB_APP_ID:-magecode}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: 8080
    networks:
      - frontend
      - backend
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped
    logging:
      <<: *loki-logging

  code-executor:
    profiles: ["app", "full"]
    build:
      context: .
      dockerfile: ./services/code-executor/Dockerfile
    container_name: magecode-code-executor
    labels:
      - service=code-executor
    environment:
      <<: *common-env
      DB_HOST: pgbouncer
      DB_PORT: ${PGBOUNCER_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SIMPLE_PROTOCOL: "true"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST}"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: "false"
      JUDGE0_URL: ${CES_JUDGE0_URL}
      JUDGE0_AUTH_TOKEN: ${CES_JUDGE0_AUTH_TOKEN}
      WORKER_COUNT: ${CES_WORKER_COUNT:-5}
    tmpfs:
      - /tmp:size=128m
    networks:
      - backend
      - judge0-link
    depends_on:
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging:
      <<: *loki-logging

  plagiarism-checker:
    build:
      context: .
      dockerfile: ./services/plagiarism-checker/Dockerfile
    container_name: magecode-plagiarism-checker
    labels:
      - service=plagiarism-checker
    profiles: ["analysis", "full"]
    environment:
      <<: *common-env
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST}"
      DOLOS_TIMEOUT: ${SIM_DOLOS_TIMEOUT:-300}
    networks:
      - backend
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging:
      <<: *loki-logging

  ai-detector:
    build:
      context: ./services/ai-detector
      dockerfile: Dockerfile
    container_name: magecode-ai-detector
    labels:
      - service=ai-detector
    profiles: ["analysis", "full"]
    environment:
      <<: *common-env
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST}"
      MODEL_NAME: ${AID_MODEL_NAME:-microsoft/codebert-base}
      BATCH_SIZE: ${AID_BATCH_SIZE:-8}
      DEVICE: ${AID_DEVICE:-cpu}
    volumes:
      - model-cache:/app/models
    tmpfs:
      - /tmp:size=256m
    deploy:
      resources:
        limits:
          memory: 3G
    networks:
      - backend
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging:
      <<: *loki-logging

  vuln-scanner:
    build:
      context: .
      dockerfile: ./services/vuln-scanner/Dockerfile
    container_name: magecode-vuln-scanner
    labels:
      - service=vuln-scanner
    profiles: ["analysis", "full"]
    environment:
      <<: *common-env
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST}"
      CODEQL_TIMEOUT: ${VUL_CODEQL_TIMEOUT:-600}
    volumes:
      - codeql-cache:/home/codeql/.codeql
    tmpfs:
      - /tmp:size=512m
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - backend
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging:
      <<: *loki-logging

  # ══════════════ DATA (4+1) ══════════════

  postgres:
    image: postgres:16-alpine
    container_name: magecode-postgres
    labels:
      - service=postgres
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - db-internal
      - backend       # Allow direct access for testing
    ports:
      - "5433:5432"   # Direct PG access for testing (bypasses PgBouncer)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: magecode-pgbouncer
    labels:
      - service=pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      # Same port inside the container and on the host, so DB_PORT is one
      # value everywhere (docker-compose-architecture.md §3: 6432 internal).
      LISTEN_PORT: ${PGBOUNCER_PORT:-6432}
      AUTH_TYPE: plain
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-30}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-150}
      MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-5}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      RESERVE_POOL_TIMEOUT: ${PGBOUNCER_RESERVE_POOL_TIMEOUT:-3}
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      ADMIN_USERS: ${POSTGRES_USER}
      LOG_CONNECTIONS: 1
      LOG_DISCONNECTIONS: 1
      LOG_POOLER_ERRORS: 1
      STATS_PERIOD: 60
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    networks:
      - backend
      - db-internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: magecode-rabbitmq
    labels:
      - service=rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./deploy/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - backend
      - monitoring
    ports:
      - "5672:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: magecode-minio
    labels:
      - service=minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Prometheus scrapes /minio/v2/metrics/cluster, which demands a bearer
      # JWT unless auth is public. Safe here only because those metrics ride
      # the same :9000 port as the S3 API and that port is bound to loopback
      # below — Prometheus reaches minio:9000 over the monitoring network.
      # G3: switch to token auth before anything binds :9000 more widely.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    networks:
      - backend
      - monitoring
    ports:
      # Loopback only: the S3 API also serves unauthenticated Prometheus
      # metrics (see MINIO_PROMETHEUS_AUTH_TYPE above). Host access exists for
      # the storage integration tests; services use minio:9000 internally.
      - "127.0.0.1:9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: magecode-minio-init
    entrypoint: /bin/sh
    command: -c "mc alias set magecode http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing magecode/${MINIO_BUCKET}"
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy

  # ══════════════ ROUTING (1) ══════════════

  traefik:
    profiles: ["app", "full"]
    image: traefik:v3
    container_name: magecode-traefik
    labels:
      - service=traefik
    ports:
      - "80:80"
      - "443:443"
      # Đã gỡ map port 8080:8080 để nhường cho lệnh 'make dev-reverb' chạy trên máy host.
      - "8082:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/docker/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - frontend
      - monitoring
    restart: unless-stopped
    logging:
      <<: *loki-logging

  # ══════════════ LOGGING (1) — default profile ══════════════

  loki:
    image: grafana/loki:3
    container_name: magecode-loki
    labels:
      - service=loki
    volumes:
      - loki-data:/loki
      - ./deploy/docker/loki/loki.yml:/etc/loki/local-config.yaml:ro
    networks:
      - monitoring
    ports:
      - "3100:3100"
    restart: unless-stopped

  # ══════════════ OBSERVABILITY (2) — profile: observability ══════════════

  prometheus:
    image: prom/prometheus:latest
    container_name: magecode-prometheus
    labels:
      - service=prometheus
    profiles: ["observability", "full"]
    volumes:
      - prometheus-data:/prometheus
      - ./deploy/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/docker/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS:-15d}"
      - "--web.enable-lifecycle"
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: magecode-grafana
    labels:
      - service=grafana
    profiles: ["observability", "full"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - monitoring
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ══════════════ EXPORTERS (3) — profile: observability ══════════════

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: magecode-postgres-exporter
    profiles: ["observability", "full"]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?sslmode=disable"
    networks:
      - monitoring
      - db-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:latest
    container_name: magecode-pgbouncer-exporter
    profiles: ["observability", "full"]
    environment:
      PGBOUNCER_EXPORTER_HOST: pgbouncer
      PGBOUNCER_EXPORTER_PORT: 6432
      PGBOUNCER_EXPORTER_USER: ${POSTGRES_USER}
      PGBOUNCER_EXPORTER_PASS: ${POSTGRES_PASSWORD}
    networks:
      - monitoring
      - db-internal
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped

  php-fpm-exporter:
    image: hipages/php-fpm_exporter:latest
    container_name: magecode-php-fpm-exporter
    profiles: ["observability", "full"]
    environment:
      PHP_FPM_SCRAPE_URI: "tcp://api:9001/status"
    networks:
      - monitoring
      - backend
    # No depends_on api: api belongs to the app/full profiles, so requiring it
    # makes `--profile observability` alone an invalid project. The exporter
    # polls and simply reports the target down until api is up.
    restart: unless-stopped

networks:
  frontend:
    name: magecode-frontend
  backend:
    name: magecode-backend
  monitoring:
    name: magecode-monitoring
  db-internal:
    name: magecode-db-internal
    internal: true
  judge0-link:
    name: magecode-judge0-link
    external: true # FIX: Khai báo explicitly là external để tránh conflict khi chạy xen kẽ Makefile và Docker.

volumes:
  postgres-data:
    name: magecode-postgres-data
  rabbitmq-data:
    name: magecode-rabbitmq-data
  minio-data:
    name: magecode-minio-data
  prometheus-data:
    name: magecode-prometheus-data
  grafana-data:
    name: magecode-grafana-data
  loki-data:
    name: magecode-loki-data
  codeql-cache:
    name: magecode-codeql-cache
  model-cache:
    name: magecode-model-cache
