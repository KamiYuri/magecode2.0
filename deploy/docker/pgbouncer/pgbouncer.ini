; MageCode 2.0 — PgBouncer Reference Config (D-89)
; NOTE: edoburu/pgbouncer image auto-generates pgbouncer.ini from env vars.
;       This file is a reference/documentation only.
;       Override by mounting this file or using env vars in docker-compose.yml.

[databases]
; Auto-configured via DB_NAME, DB_HOST, DB_PORT env vars
; magecode = host=postgres port=5432 auth_user=magecode

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

; Auth
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; Pool (D-89)
pool_mode = transaction
default_pool_size = 30
max_client_conn = 150
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Transaction pooling requires DISCARD ALL to reset session state
server_reset_query = DISCARD ALL

; Required for pgx (Go) driver and PostgreSQL JDBC
ignore_startup_parameters = extra_float_digits,options

; Admin access for pgbouncer-exporter
admin_users = magecode

; Logging (D-87 observability)
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
