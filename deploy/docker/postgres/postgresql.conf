# MageCode 2.0 — PostgreSQL Tuning (Dev/Small Deployment)
# Mounted at: /etc/postgresql/postgresql.conf
# Ref: D-89 (max_connections must cover PgBouncer pool_size=30)

# ── Connection ──
# listen on all interfaces: containers (pgbouncer, exporters) connect over the
# docker network; postgres defaults to localhost-only when a custom conf is
# mounted, which silently breaks PgBouncer upstream connections.
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# ── Memory ──
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB

# ── WAL ──
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB

# ── Query Planner ──
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ── Logging ──
log_min_duration_statement = 1000
log_statement = ddl
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Asia/Ho_Chi_Minh'

# ── Locale ──
timezone = 'Asia/Ho_Chi_Minh'
lc_messages = 'en_US.utf8'

# ── Autovacuum ──
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60
