global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: "php-fpm"
    static_configs:
      - targets: ["php-fpm-exporter:9253"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "pgbouncer"
    static_configs:
      - targets: ["pgbouncer-exporter:9127"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
    metrics_path: /metrics

  - job_name: "minio"
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: /minio/v2/metrics/cluster

  - job_name: "code-executor"
    static_configs:
      - targets: ["code-executor:9090"]

  - job_name: "plagiarism-checker"
    static_configs:
      - targets: ["plagiarism-checker:9090"]

  - job_name: "vuln-scanner"
    static_configs:
      - targets: ["vuln-scanner:9090"]

  - job_name: "ai-detector"
    static_configs:
      - targets: ["ai-detector:9090"]
