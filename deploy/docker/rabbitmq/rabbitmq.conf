# MageCode 2.0 — RabbitMQ Configuration
# Mounted at: /etc/rabbitmq/rabbitmq.conf

# ── Memory & Disk ──
vm_memory_high_watermark.relative = 0.4
disk_free_limit.absolute = 1GB

# ── Channels ──
channel_max = 128

# ── Consumer timeout (30 min) ──
# Analysis jobs (SIM/AID/VUL) can run up to 30 minutes (D-82)
consumer_timeout = 1800000

# ── Queue ──
# Default queue type for new queues
default_vhost = magecode

# ── Management (dev) ──
management.cors.allow_origins.1 = *
management.cors.max_age = 3600

# ── Logging ──
log.console = true
log.console.level = warning
log.file = false

# ── Heartbeat ──
heartbeat = 60

# ── Prometheus metrics ──
# Plugin enabled via enabled_plugins file
prometheus.return_per_object_metrics = true
