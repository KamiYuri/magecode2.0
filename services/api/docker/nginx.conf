server {
    listen 9000;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Laravel: all requests → index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
    }

    # Health check endpoint — same front controller, just without access logs.
    # $document_root is already .../public, so appending /public here would
    # resolve to a nonexistent file and PHP-FPM would answer 404.
    location = /api/health {
        access_log off;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }
}
